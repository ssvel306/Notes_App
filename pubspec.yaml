name: notiva
description: A beautiful, feature-rich notes app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # UUID generation
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  # To add assets, create an assets directory and reference here:
  # assets:
  #   - assets/images/

  # fonts are loaded via google_fonts package
